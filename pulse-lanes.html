<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Lanes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sixtyfour&family=Inter+Tight:wght@400;600;800&display=swap">
<style>
/* Layout: one tall four-lane highway centred on a pulsing backdrop; song picker and results as overlay cards. Single dark neon look by choice. */
:root {
  --bg: #07050f;
  --ink: #f4f1ff;
  --muted: #8f88b0;
  --l1: #ff4fa3; --l2: #ffd04f; --l3: #4fffd2; --l4: #6f8bff;
  --panel: rgba(14, 10, 30, 0.92);
  --display: "Sixtyfour", "Courier New", monospace;
  --body: "Inter Tight", system-ui, -apple-system, Segoe UI, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
/* phones: fit the visible screen (not the area behind the browser bars) */
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body { position: fixed; inset: 0; height: auto; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; }
canvas { display: block; touch-action: none; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(4, 2, 10, 0.55); }
.card { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid #2c2452; border-radius: 16px; padding: 24px; display: grid; gap: 12px; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 7vw, 38px); line-height: 1.1; background: linear-gradient(90deg, var(--l1), var(--l2), var(--l3), var(--l4)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card h2 { margin: 0; font-weight: 800; font-size: 28px; }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
.card p b { color: var(--ink); }
.songs { display: grid; gap: 8px; }
.song { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; font: inherit; color: var(--ink); background: rgba(255,255,255,0.04); border: 1px solid #2c2452; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.song:hover { border-color: var(--c); }
.song:focus-visible, .go:focus-visible { outline: 2px solid var(--c, var(--l3)); outline-offset: 2px; }
.song b { font-weight: 800; font-size: 16px; color: var(--c); }
.song span { color: var(--muted); font-size: 13px; }
.song .best { grid-row: span 2; align-self: center; text-align: right; font-variant-numeric: tabular-nums; }
.song .best strong { display: block; color: var(--ink); font-size: 18px; }
.keys { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
kbd { font: 700 12px var(--body); border: 1px solid #4a4270; border-bottom-width: 2px; border-radius: 4px; padding: 1px 7px; color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; font-variant-numeric: tabular-nums; }
.stats div { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 8px 4px; font-size: 12px; color: var(--muted); }
.stats strong { display: block; font-size: 20px; color: var(--ink); }
.grade { font-family: var(--display); font-size: 56px; line-height: 1; }
.go { justify-self: start; font: 700 15px var(--body); color: #08060f; background: var(--l3); border: 0; border-radius: 10px; padding: 10px 20px; cursor: pointer; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.ghost { font: 600 14px var(--body); color: var(--ink); background: none; border: 1px solid #2c2452; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
@media (pointer: coarse) { .keys-only { display: none; } }
/* phones: cards fit the width, and tall cards scroll instead of being cut off */
.card { box-sizing: border-box; }
.overlay { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.overlay > .card { margin: auto; }
@media (max-height: 520px) { .overlay > .card { padding: 16px 20px; gap: 10px; } .overlay > .card h1 { font-size: clamp(30px, 9vh, 44px); } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="overlay" id="menu">
    <div class="card">
      <h1>PULSE LANES</h1>
      <p>Notes fall down four lanes in time with the music. <b>Hit each lane just as a note crosses the line.</b> Chain hits for a combo; a miss breaks it. Turn your sound on.</p>
      <div class="keys keys-only">Keys <kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd> or <kbd>←</kbd><kbd>↓</kbd><kbd>↑</kbd><kbd>→</kbd></div>
      <p class="touch-only" style="display:none"></p>
      <div class="songs" id="songs"></div>
    </div>
  </div>
  <div class="overlay" id="result" hidden>
    <div class="card">
      <div class="row" style="align-items:center;gap:16px"><div class="grade" id="grade">A</div><div><h2 id="rTitle">Song</h2><p id="rScore"></p></div></div>
      <div class="stats" id="stats"></div>
      <p id="rText"></p>
      <div class="row"><button class="go" id="retryBtn">Play again</button><button class="ghost" id="menuBtn">Pick a song</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const COLS = ['#ff4fa3', '#ffd04f', '#4fffd2', '#6f8bff'];
  let VW, VH, dpr;
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * dpr; cv.height = VH * dpr; cv.style.width = VW + 'px'; cv.style.height = VH + 'px'; }
  addEventListener('resize', resize); resize();

  // ---------- songs (all music is generated here) ----------
  const SONGS = [
    { id: 'drift', name: 'Neon Drift', level: 'Easy', bpm: 96, bars: 24, root: 57, prog: [0, -4, 3, -2], scale: [0, 3, 5, 7, 10], c: '#4fffd2', density: 0 },
    { id: 'run', name: 'Midnight Run', level: 'Normal', bpm: 118, bars: 28, root: 55, prog: [0, 5, 3, -2], scale: [0, 2, 3, 7, 10], c: '#ffd04f', density: 1 },
    { id: 'starfall', name: 'Starfall', level: 'Hard', bpm: 140, bars: 32, root: 52, prog: [0, -4, -2, -5], scale: [0, 3, 5, 7, 10], c: '#ff4fa3', density: 2 }
  ];
  let seed = 1; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  function makeChart(S) {
    seed = S.bpm * 7919;
    const beat = 60 / S.bpm, notes = [], lead = 2 * 4 * beat; // two bars of intro
    let lastLane = 0;
    for (let bar = 0; bar < S.bars; bar++) {
      const section = Math.floor(bar / 4) % 4; // groove changes every 4 bars
      for (let s = 0; s < 16; s++) {            // sixteenth-note grid
        const tm = lead + (bar * 16 + s) * beat / 4;
        let p = 0;
        if (s % 4 === 0) p = 0.95;
        else if (s % 2 === 0) p = [0.1, 0.55, 0.75][S.density] * (section === 2 ? 1.2 : 1);
        else p = [0, 0.06, 0.28][S.density] * (section === 3 ? 1.6 : 1);
        if (bar >= S.bars - 1 && s > 0) p = 0;
        if (rnd() >= p) continue;
        // lanes walk up and down like a melody so patterns feel playable
        let lane = (lastLane + (rnd() < 0.5 ? 1 : -1) * (rnd() < 0.75 ? 1 : 2) + 4) % 4;
        if (S.density === 0 && s % 8 === 0) lane = [0, 3, 1, 2][(bar + s / 8) % 4];
        notes.push({ t: tm, lane, hit: null });
        lastLane = lane;
        if (S.density >= 1 && s === 0 && bar % 2 === 1 && rnd() < 0.6 * S.density) notes.push({ t: tm, lane: (lane + 2) % 4, hit: null });
      }
    }
    return { notes, length: lead + S.bars * 4 * beat + 1.5, lead, beat };
  }

  // ---------- audio engine ----------
  let actx = null, master;
  function audio() {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination); }
    if (actx.state === 'suspended') actx.resume();
  }
  function kick(t) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g).connect(master); o.start(t); o.stop(t + 0.3); }
  let noiseBuf = null;
  function noise(t, dur, hp, vol) {
    if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = actx.createBufferSource(); s.buffer = noiseBuf; const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const g = actx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  function synth(t, freq, dur, type, vol, cutoff) {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t); f.frequency.exponentialRampToValueAtTime(Math.max(200, cutoff / 4), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  // schedule the whole song up front (it's short)
  function scheduleSong(S, chart, t0) {
    const beat = chart.beat, total = (2 + S.bars) * 16;
    for (let i = 0; i < total; i++) {
      const tm = t0 + i * beat / 4, bar = Math.floor(i / 16), s = i % 16, intro = bar < 2;
      const chord = S.root + S.prog[Math.floor(bar / 1) % S.prog.length];
      if (s % 4 === 0) kick(tm);
      if (!intro && s % 8 === 4) noise(tm, 0.18, 1500, 0.35);
      if (s % 2 === 1 || (S.density === 2 && !intro)) noise(tm, 0.04, 7000, s % 2 ? 0.12 : 0.06);
      if (!intro && (s % 4 === 2 || s === 0)) synth(tm, midi(chord - 12), beat * 0.45, 'sawtooth', 0.22, 900);
      if (s === 0) for (const iv of [0, 3, 7]) synth(tm, midi(chord + iv), beat * 3.8, 'triangle', 0.05, 2400);
    }
    // melody follows the chart notes so hits line up with what you hear
    for (const n of chart.notes) {
      const bar = Math.floor((n.t - chart.lead) / (beat * 4));
      const chord = S.root + S.prog[((bar % S.prog.length) + S.prog.length) % S.prog.length];
      n.freq = midi(chord + 12 + S.scale[(n.lane + bar) % S.scale.length]);
      synth(t0 + n.t, n.freq, beat * 0.4, 'square', 0.045, 3200);
    }
  }

  // ---------- game state ----------
  let song = null, chart = null, t0 = 0, state = 'menu', stats, combo, maxCombo, score, flashes = [0, 0, 0, 0], press = [0, 0, 0, 0], judge = null, pulse = 0, lastBeat = -1;
  const WIN = { perfect: 0.05, good: 0.11, ok: 0.16 };
  const SPEED = () => VH * 0.85; // pixels per second the notes fall
  function now() { return actx ? actx.currentTime - t0 : 0; }

  function start(S) {
    audio();
    song = S; chart = makeChart(S);
    stats = { perfect: 0, good: 0, ok: 0, miss: 0 }; combo = 0; maxCombo = 0; score = 0; judge = null; lastBeat = -1;
    t0 = actx.currentTime + 0.3;
    scheduleSong(S, chart, t0);
    state = 'play'; $('menu').hidden = true; $('result').hidden = true;
  }
  function stopAudio() { if (actx) { try { master.disconnect(); } catch (e) {} master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination); } }

  function hitLane(l) {
    press[l] = 0.12;
    if (state !== 'play') return;
    const tn = now();
    let best = null, bd = 1;
    for (const n of chart.notes) { if (n.hit || n.lane !== l) continue; const d = Math.abs(n.t - tn); if (d < bd) { bd = d; best = n; } if (n.t - tn > 0.3) break; }
    if (!best || bd > WIN.ok) return;
    const kind = bd <= WIN.perfect ? 'perfect' : bd <= WIN.good ? 'good' : 'ok';
    best.hit = kind; stats[kind]++; combo++; maxCombo = Math.max(maxCombo, combo);
    score += { perfect: 300, good: 200, ok: 100 }[kind] * (1 + Math.min(combo, 50) / 50);
    flashes[l] = 1; judge = { kind, t: tn };
  }
  function update() {
    if (state !== 'play') return;
    const tn = now();
    for (const n of chart.notes) if (!n.hit && tn - n.t > WIN.ok) { n.hit = 'miss'; stats.miss++; combo = 0; judge = { kind: 'miss', t: tn }; }
    const b = Math.floor((tn - 0) / chart.beat); if (b !== lastBeat && tn > 0) { lastBeat = b; pulse = 1; }
    if (tn > chart.length) finish();
  }
  function finish() {
    state = 'result';
    const total = chart.notes.length, acc = (stats.perfect + stats.good * 0.7 + stats.ok * 0.4) / total;
    const grade = acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : acc >= 0.5 ? 'C' : 'D';
    const sc = Math.round(score);
    let best = 0; try { best = +localStorage.getItem('pulse-' + song.id) || 0; } catch (e) {}
    const nb = sc > best; if (nb) { try { localStorage.setItem('pulse-' + song.id, String(sc)); localStorage.setItem('pulse-grade-' + song.id, grade); } catch (e) {} }
    $('grade').textContent = grade; $('grade').style.color = song.c;
    $('rTitle').textContent = song.name;
    $('rScore').textContent = sc.toLocaleString() + ' points · ' + Math.round(acc * 100) + '% accuracy';
    $('stats').innerHTML = [['Perfect', stats.perfect], ['Good', stats.good], ['OK', stats.ok], ['Miss', stats.miss]].map(([k, v]) => '<div><strong>' + v + '</strong>' + k + '</div>').join('');
    $('rText').textContent = (stats.miss === 0 ? 'Full combo! ' : 'Longest combo ' + maxCombo + '. ') + (nb ? 'New best for this song.' : 'Your best is ' + best.toLocaleString() + '.');
    $('result').hidden = false; $('retryBtn').focus();
  }

  // ---------- drawing ----------
  function render() {
    const W = VW, H = VH;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#07050f'; ctx.fillRect(0, 0, W, H);
    pulse *= 0.9;
    const laneW = Math.min(100, (W - 32) / 4), x0 = (W - laneW * 4) / 2, hitY = H - Math.max(110, H * 0.16);
    // backdrop rings pulse on the beat
    for (let k = 0; k < 4; k++) { ctx.strokeStyle = 'rgba(111,139,255,' + (0.05 + pulse * 0.08) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W / 2, hitY, 120 + k * 120 + pulse * 20, 0, 7); ctx.stroke(); }
    // lanes
    for (let l = 0; l < 4; l++) {
      const x = x0 + l * laneW;
      const g = ctx.createLinearGradient(0, 0, 0, hitY); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, COLS[l] + (press[l] > 0 ? '30' : '14'));
      ctx.fillStyle = g; ctx.fillRect(x + 2, 0, laneW - 4, hitY);
      ctx.fillStyle = '#ffffff10'; ctx.fillRect(x, 0, 1, H);
      if (flashes[l] > 0) { ctx.fillStyle = COLS[l] + Math.round(flashes[l] * 120).toString(16).padStart(2, '0'); ctx.fillRect(x + 2, hitY - 160, laneW - 4, 160); flashes[l] -= 0.06; }
      if (press[l] > 0) press[l] -= 1 / 60;
    }
    ctx.fillStyle = '#ffffff10'; ctx.fillRect(x0 + laneW * 4, 0, 1, H);
    // hit line + targets
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x0, hitY - 1, laneW * 4, 2);
    for (let l = 0; l < 4; l++) {
      const cx = x0 + l * laneW + laneW / 2;
      ctx.strokeStyle = COLS[l]; ctx.lineWidth = 3; ctx.globalAlpha = press[l] > 0 ? 1 : 0.55;
      ctx.beginPath(); ctx.arc(cx, hitY, laneW * 0.32, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(244,241,255,0.4)'; ctx.font = '700 13px "Inter Tight", sans-serif'; ctx.textAlign = 'center';
      if (matchMedia('(pointer: fine)').matches) ctx.fillText('DFJK'[l], cx, hitY + laneW * 0.32 + 22);
    }
    // notes
    if (chart) {
      const tn = now(), sp = SPEED();
      for (const n of chart.notes) {
        if (n.hit && n.hit !== 'miss') continue;
        const y = hitY - (n.t - tn) * sp;
        if (y < -40) break; if (y > H + 40) continue;
        const cx = x0 + n.lane * laneW + laneW / 2, r = laneW * 0.3, c = COLS[n.lane];
        ctx.globalAlpha = n.hit === 'miss' ? 0.25 : 1;
        ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - r, y - 9, r * 2, 18, 9) : ctx.rect(cx - r, y - 9, r * 2, 18); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(cx - r + 8, y - 5, r * 2 - 16, 3);
        ctx.globalAlpha = 1;
      }
      // HUD
      ctx.textAlign = 'center'; ctx.fillStyle = '#f4f1ff'; ctx.font = '800 30px "Inter Tight", sans-serif';
      ctx.fillText(Math.round(score).toLocaleString(), W / 2, 50);
      ctx.font = '600 13px "Inter Tight", sans-serif'; ctx.fillStyle = '#8f88b0'; ctx.fillText(song.name.toUpperCase() + ' · ' + song.level.toUpperCase(), W / 2, 72);
      if (combo >= 5) { ctx.font = '400 26px Sixtyfour, monospace'; ctx.fillStyle = song.c; ctx.fillText(combo + ' COMBO', W / 2, hitY - 210); }
      if (judge && tn - judge.t < 0.5) {
        const a = 1 - (tn - judge.t) / 0.5, col = { perfect: '#4fffd2', good: '#ffd04f', ok: '#6f8bff', miss: '#ff4f6a' }[judge.kind];
        ctx.globalAlpha = a; ctx.font = '800 28px "Inter Tight", sans-serif'; ctx.fillStyle = col; ctx.fillText(judge.kind.toUpperCase(), W / 2, hitY - 170 - (1 - a) * 20); ctx.globalAlpha = 1;
      }
      // progress
      const prog = Math.max(0, Math.min(1, tn / chart.length));
      ctx.fillStyle = '#ffffff14'; ctx.fillRect(x0, 88, laneW * 4, 4); ctx.fillStyle = song.c; ctx.fillRect(x0, 88, laneW * 4 * prog, 4);
      if (tn < chart.lead - 0.2) { ctx.font = '600 16px "Inter Tight", sans-serif'; ctx.fillStyle = 'rgba(244,241,255,0.8)'; ctx.fillText('Get ready…', W / 2, H * 0.4); }
    }
  }

  // ---------- input ----------
  const KEYS = { d: 0, f: 1, j: 2, k: 3, arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3 };
  const down = new Set();
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k in KEYS) { e.preventDefault(); if (!down.has(k)) { down.add(k); hitLane(KEYS[k]); } }
    if (k === 'escape' && state === 'play') { stopAudio(); state = 'menu'; showMenu(); }
  });
  addEventListener('keyup', e => down.delete(e.key.toLowerCase()));
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const laneW = Math.min(100, (VW - 32) / 4), x0 = (VW - laneW * 4) / 2;
    const l = Math.floor((e.clientX - x0) / laneW);
    if (l >= 0 && l < 4) hitLane(l);
  });

  function showMenu() {
    const box = $('songs'); box.innerHTML = '';
    for (const S of SONGS) {
      let best = 0, grade = ''; try { best = +localStorage.getItem('pulse-' + S.id) || 0; grade = localStorage.getItem('pulse-grade-' + S.id) || ''; } catch (e) {}
      const b = document.createElement('button'); b.className = 'song'; b.style.setProperty('--c', S.c);
      b.innerHTML = '<b>' + S.name + '</b><span class="best">' + (best ? '<strong>' + grade + '</strong>' + best.toLocaleString() : 'not played') + '</span><span>' + S.level + ' · ' + S.bpm + ' BPM</span>';
      b.addEventListener('click', () => start(S));
      box.appendChild(b);
    }
    $('result').hidden = true; $('menu').hidden = false;
  }
  $('retryBtn').addEventListener('click', () => start(song));
  $('menuBtn').addEventListener('click', () => { state = 'menu'; showMenu(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { stopAudio(); state = 'menu'; showMenu(); } });

  showMenu();
  (function loop() { update(); render(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
